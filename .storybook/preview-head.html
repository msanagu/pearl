<!--
  Fontshare CDN faces — Zodiak + General Sans (Freshwater), Boska (South
  Sea), Switzer (Tahitian), Gambetta (Pearl). Not on npm/@fontsource, so
  loaded here rather than self-hosted like the rest of the system's fonts.

  Two Fontshare API constraints shape each request below:
  - Only the first `f[]` family in a request survives; the rest drop silently.
    So one family per request.
  - Each request caps at 3 styles; a 4th breaks the whole response. Families
    with more weights are split across requests (General Sans 3+2, Switzer 3+1).

  Zodiak italic is requested as `weight + 1` (401, 701) — Fontshare has no
  separate italic flag. It still applies wherever `southSeaFonts.serif` +
  `font-style: italic` is used, though South Sea's default italic is Times
  (see `southSeaFonts.serifItalic` in south-sea.css.ts).

  Only Pearl's face (Gambetta) is preloaded here: `initialGlobals` pins the
  deployed site's default theme to Pearl (see preview.tsx), and this build is
  the actual GitHub Pages landing page — blocking first paint on three
  themes' worth of fonts nobody's viewing yet is wasted render-blocking
  weight. The other themes' faces are injected on demand, only once their
  theme is actually selected, by the `loadThemeFonts` decorator in
  preview.tsx.
-->
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://api.fontshare.com" />
<link
  rel="preload"
  as="style"
  href="https://api.fontshare.com/v2/css?f[]=gambetta@401&display=swap"
  onload="this.onload=null;this.rel='stylesheet'"
/>
<noscript>
  <link
    href="https://api.fontshare.com/v2/css?f[]=gambetta@401&display=swap"
    rel="stylesheet"
  />
</noscript>
